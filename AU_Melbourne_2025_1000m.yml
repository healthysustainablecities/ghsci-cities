  ## Languages configuration
  languages:
    ## Add a list of languages as required.
    ## Languages listed should correspond to columns in the 'languages' worksheet
    ## of the file process/configuration/_report_configuration.xlsx.
    ## If the software has not yet been used, the template for this file is
    ## located in the 'templates' subdirectory.
    ## Supported languages can also be viewed by running the python command
    ## ghsci.get_languages().
    ## New languages can be added, although some may require additional fonts.
    ## Some languages may not yet be supported (eg. complex scripts like Tamil
    ## and Thai may not be supported by the report template and require manual
    ## edits, and right-to-left layouts may not yet be correctly represented).
    English:
      ## City name in English, for example: Las Palmas
      name: "Naarm / Melbourne"
      ## Country name in English, for example: Spain
      country: "Australia"
      ## After reviewing the policy and/or spatial indicator results, update
      ## the text of the following summary records to contextualise your findings,
      ## and relate to external text and documents (e.g. using website hyperlinks).
      ## This text will be used in the respective report summaries.
      summary_policy: |
        Naarm / Melbourne had good coverage of urban planning and transport policies that are important for creating healthy and sustainable cities. The policy framework generally promotes healthy, walkable neighbourhoods with urban greening, and nearby access to destinations such as jobs, shops, public transport and open space. However, while most policies aligned with healthy cities evidence, some policies related to walkability, destination access and transport policy to limit air pollution were partly inconsistent with evidence. Melbourne also lacked measurable policy targets for over one third of the policy indicators. The findings highlight the need to strengthen urban and transport policies, ensuring that they align with best-practice evidence and include measurable targets to guide implementation of healthy and sustainable city objectives across all neighbourhoods.
      summary_spatial: |
        The spatial analysis found persistent inequities in the delivery of neighbourhoods that support healthy and sustainable lifestyles. The majority of neighbourhoods in Melbourne have low walkability and poor access to fresh food and regularly serviced public transport. The distribution of walkability and public transport access favours inner-city and middle suburban neighbourhoods. Few Melbourne residents live in neighbourhoods that meet population density and street connectivity thresholds to achieve at least 80% probability of engaging in any walking for transport. While 90% of residents have some public open space within 500m, this drops to 66% having access to public open space of 1.5 hectares or larger. However, 71.5% of the population live within 500m of green space of at least 1 hectare in size. Approximately 20% of the city's population live in areas most vulnerable to urban heat, concentrated in the city's north-western and south-eastern suburbs. The findings underscore the need for policy standards and targeted interventions to better support healthy and sustainable living across all neighbourhoods.
      summary_policy_spatial: |
        Naarm / Melbourne had good coverage of urban planning and transport policies that are important for creating healthy and sustainable cities. The policy framework generally promotes healthy, walkable neighbourhoods with urban greening, and nearby access to destinations such as jobs, shops, public transport and open space. However, while most policies aligned with healthy cities evidence, some policies related to walkability, destination access and transport policy to limit air pollution were partly inconsistent with evidence. Melbourne also lacked measurable policy targets for over one third of the policy indicators. 
        The spatial analysis found persistent inequities in the delivery of neighbourhoods that support healthy and sustainable lifestyles. The majority of neighbourhoods in Melbourne have low walkability and poor access to fresh food and regularly serviced public transport. The distribution of walkability and public transport access favours inner-city and middle suburban neighbourhoods. Few Melbourne residents live in neighbourhoods that meet population density and street connectivity thresholds to achieve at least 80% probability of engaging in any walking for transport. While 90% of residents have some public open space within 500m, this drops to 66% having access to public open space of 1.5 hectares or larger. However, 71.5% of the population live within 500m of green space of at least 1 hectare in size. Approximately 20% of the city's population live in areas most vulnerable to urban heat, concentrated in the city's north-western and south-eastern suburbs. The findings highlight the need to strengthen urban and transport policies and interventions, with monitoring to ensure that healthy and sustainable city objectives are consistently delivered across all neighbourhoods.

      ## Contextual summary for study region spatial report.  Users may choose to
      ## translate these entries (following the hyphen) for languages configured
      ## for their city.  Remember, if you put a colon (":") in, put quotes
      ## around the text to make it explicitly understood as text.
      context:
        ## A brief summary of region characteristics
        - City context:
            ## Contextual information about your study region. Please briefly
            ## summarise the city location, history and topography, as relevant.
            - summary: "Naarm / Melbourne is the capital of the state of Victoria, Australia, situated at the head of Port Phillip Bay, centered on the Yarra River (Birrarung). It is located on the traditional lands of the people of the Kulin Nation who have lived there for over 2000 generations. Europeans arrived in 1835, with the inner city grid laid out on the northern side of the Birrarung in 1837. Greater Melbourne has grown to be Australia's second largest city by area, spanning approximately 10,000 km² and housing 5 million people across 31 municipalities."
            - source: ""
        - Demographics and health equity:
            ## For example, highlight socio-economic demographic characteristics
            ## and key health challenges and inequities present in this urban area.
            - summary: "Melbourne is a growing, multicultural city. While the established inner city is regarded as highly liveable, many middle and outer neighbourhoods are characterised by car dependence and low-density sprawl. Infrastructure and service provision have lagged amidst rapid outer-suburban expansion, compounding neighbourhood disadvantage in socioeconomically disadvantaged areas. Non-communicable diseases are the largest cause of avoidable death, with risk factors including overweight and obesity, unhealthy diets and physical inactivity."
            - source: ""
        - Environmental disaster context:
            ## For example, environmental hazards likely to be experience by the
            ## urban area over the next 5-10 years, may include [insert those
            ## listed as ‘yes’ in the policy checklist].  Completed policy
            ## checklist values will be added, but prose may be customised here.
            - summary: "Environmental hazards that may impact the urban area over the coming decade include: severe storms, floods, bushfires/wildfires, heatwaves."
            - source: "Add any citations used here."
        - Levels of government:
            ## For example, for this report, policies from [insert levels of government from policy checklist,  e.g. national, metropolitan, local] levels of government were analysed. Completed policy checklist values will be added, but prose may be customised here.
            - summary: ""
            - source: "Add any citations used here."
        - Additional context:
            ## The 'Additional context' section is only included in spatial reports, and only if
            ## information is added in the 'summary' section below.  Detail any other
            ## considerations relating to urban health inequities and geography in
            ## this city, or data considerations that could influence interpretation
            ## of findings.
            - summary: ""
            - source: "Add any citations used here."
  ## Optionally, exceptions to the template can be specified here, this can be
