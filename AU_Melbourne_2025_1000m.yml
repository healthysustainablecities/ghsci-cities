###########################################################
## Example configuration for Las Palmas de Gran Canaria,
## Spain using Study region configuration template v4.2.3
## (23 December 2024)
##
## This configuration file uses the YAML format (https://yaml.org/)
## to describe the data sources, parameters and metadata used to
## analyse and generate urban indicator resources using the Global
## Healthy and Sustainable City Indicators software
## (https://global-healthy-liveable-cities.github.io/).
##
## Text beginning with a double hash symbol ("##") are comments
## (used to provide descriptions of how to complete the item
## immediately below). Text beginning with a single hash symbol
## ("#") are commented out sections of code that may optionally be
## uncommented as per the provided instructions.
##
## Optional sections that contain parameters which may be
## uncommented are marked with a series of hash symbols ("###########")
## at their start and end lines.
##
## It is recommended to view or edit this file in an application
## providing syntax highlighting, for example, the provided Jupyter
## Lab web app:
## - type 'lab' at the GHSCI prompt
## - navigate the file browser to "process/configuration/region/"
## - double click on a region configuration file ending in ".yml"
##
## YAML configuration checking tools may be run however, some rules
## are ignored in order to provide detailed comment advice.
## The following are settings to support automated YAML checks to work
# yamllint disable rule:line-length
###########################################################
---
name: Melbourne
country: Australia
country_code: AU
continent: Oceania
year: 2025
crs:
  name: GDA2020 / Vicgrid
  standard: EPSG
  srid: 7899
study_region_boundary:
  data: AU/GCCSA_2021_AUST_SHP_GDA2020.zip -where  "GCC_NAME21='Greater Melbourne'"
  source: Australian Bureau of Statistics
  publication_date: 2021-07-20
  url: https://www.abs.gov.au/statistics/standards/australian-statistical-geography-standard-asgs-edition-3/jul2021-jun2026/access-and-downloads/digital-boundary-files/GCCSA_2021_AUST_SHP_GDA2020.zip
  licence: CC-BY-4.0
  urban_intersection: true
  citation: "Australian Bureau of Statistics (2021). Greater Capital City Statistical Areas - 2021 - Shapefile. Australian Statistical Geography Standard (ASGS) Edition 3 https://www.abs.gov.au/statistics/standards/australian-statistical-geography-standard-asgs-edition-3/jul2021-jun2026."
  notes: Reference period July 2021 - June 2026
urban_region:
  name: "ABS ASGS Sections of State 2025"
  data_dir: AU/SOS_2021_AUST_GDA2020_SHP.zip -where "SOS_NAME21 IN ('Major Urban','Other Urban')"
  licence: CC BY 4.0
  citation: "Australian Bureau of Statistics (2021). Section of State - 2021 - Shapefile. Australian Statistical Geography Standard (ASGS) Edition 3 https://www.abs.gov.au/statistics/standards/australian-statistical-geography-standard-asgs-edition-3/jul2021-jun2026."
population:
  name: "Australian population grid 2025 in GeoTIFF format (ABS 2024)"
  data_dir: AU/Australian_Population_Grid_2025_in_GEOTIFF_format
  data_type: raster:Int64
  resolution: 1000m
  raster_band: 1
  raster_nodata: -200
  pop_min_threshold: 1
  crs_name: GDA94 / Australian Albers
  crs_standard: EPSG
  crs_srid: 3577
  source_url: https://www.abs.gov.au/statistics/people/population/regional-population/2024-25/GEOTIFF.zip
  year_published: 2026
  year_target: 2025
  date_acquired: 20260331
  licence: CC BY 4.0
  citation: "Australian Bureau of Statistics. 2026. Regional population: Australian population grid 2025 in GeoTIFF format. https://www.abs.gov.au/statistics/people/population/regional-population/2024-25. Accessed 31 March 2026."
OpenStreetMap:
  data_dir: AU/australia-260112.osm.pbf
  source: Geofabrik GmbH
  publication_date: 20260112
  licence: ODbL
  url: https://download.geofabrik.de/australia-oceania/australia.html
  note: Australia OpenStreetMap excerpt
network:
  #########
  ## Optional network parameters for use in some contexts (eg. island cities)
  ## Whether to only retain main connected network when retrieving OSM roads.
  ## For most settings, set to "false" (the default, used if commented out).
  ## To retain network 'islands' if present, set to "true".
  osmnx_retain_all: true
  ## Whether to extract the network for the buffered study region.
  ## It is recommended to set to 'true' (the default) in most cases.
  ## Setting this to false may be appropriate for true islands, but could be
  ## problematic for anywhere else where the network and associated amenities
  ## may be accessible beyond the edge of the study region boundary.
  buffered_region: true
  #########
  ## Optionally, data for evaluating intersections can be provided as an
  ## alternative to deriving intersections from OpenStreetMap.
  ## Where such data are available, this may be preferable.
  ## Uncomment and complete the below required fields to use this option.
  ## Custom intersection data settings
  intersections:
    ## path to data relative to the project data directory
    data: AU/DTP-Vicmap-Transport-Road-Infrastructure-2026-02-14.zip/gda2020_vicgrid/esrishape/user_polygon/user_polygon-1000/VMTRANS/TR_ROAD_INFRASTRUCTURE.shp -where "\"FTYPE_CODE\" IN ('int_nosignal','int_signal','roundabout')"
    ## citation for optional custom intersection data
    citation: 'Victorian Department of Transport and Planning. 2026. Vicmap Transport - Road Infrastructure Point. https://datashare.maps.vic.gov.au/search?q=uuid%3D359796da-2caa-5c38-9837-9a67f920675f'
    ## a note to describe custom intersection data
    note: "Clean intersection locations from Victoria's official road infrastructure data, last updated 14 February 2026.  Query was manually verified using QGIS."
country_gdp:
  classification: High-income
  citation: "The World Bank. 2026. World Bank country and lending groups: Current classification by income in XLSX format. https://ddh-openapi.worldbank.org/resources/DR0095333/download"
